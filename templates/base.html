<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADBMS Cloud Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar p-3">
    <h5 class="mb-4"><i class="bi bi-cloud"></i> ADBMS Cloud</h5>
    <a href="/" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/files" class="nav-link"><i class="bi bi-folder2-open"></i> Files</a>
    <a href="/trash" class="nav-link"><i class="bi bi-trash3"></i> Trash</a>
    <a href="/admin/" class="nav-link"><i class="bi bi-shield-lock"></i> Admin</a>
    <a href="/logout" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
  </aside>
  <main class="p-4 flex-grow-1">
    {% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}
      <div class="alert alert-{{cat}} alert-dismissible fade show">{{msg}}<button class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body></html>
